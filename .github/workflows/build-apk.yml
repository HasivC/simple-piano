name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run tests
        shell: pwsh
        run: |
          node tools/smoke-test.mjs
          node tools/dom-sim.mjs

      - name: Fetch minimal Android SDK
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/fetch-sdk.ps1

      - name: Build APK
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/build-apk.ps1

      - name: Build standalone html
        shell: pwsh
        run: node build-standalone.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: PIANO
          path: |
            dist/*.apk
            piano-standalone.html
